name: M3U8 Stream Checker and Playlist Creator

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: "Enter your source M3U playlist URL"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: m3u8-stream-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Download source playlist
        env:
          PLAYLIST_URL: ${{ inputs.playlist_url }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          from urllib.parse import urlparse

          url = os.environ["PLAYLIST_URL"].strip()
          parsed = urlparse(url)

          if parsed.scheme not in ("http", "https") or not parsed.netloc:
              raise SystemExit("Invalid HTTP/HTTPS playlist URL")

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = response.read(10 * 1024 * 1024 + 1)

          if len(data) > 10 * 1024 * 1024:
              raise SystemExit("Playlist exceeds 10 MB")

          content = data.decode("utf-8-sig", errors="replace")

          if not any(
              line.strip() == "#EXTM3U"
              for line in content.splitlines()[:10]
          ):
              raise SystemExit("Invalid M3U playlist")

          with open("source.m3u", "w", encoding="utf-8") as f:
              f.write(content)

          print("Source playlist downloaded successfully")
          PY

      - name: Check streams and create working M3U8 playlist
        run: |
          cat > check_m3u.py <<'PY'
          import subprocess
          from urllib.parse import urlparse
          from datetime import datetime, timezone

          MAX_LINKS = 1000
          TIMEOUT_SECONDS = 25

          def is_http_url(url):
              p = urlparse(url)
              return p.scheme in ("http", "https") and bool(p.netloc)

          def is_m3u8_url(url):
              return urlparse(url).path.lower().endswith(".m3u8")

          # Parse playlist entries while preserving original EXTINF metadata.
          entries = []
          extinf = None
          extras = []
          seen = set()

          with open("source.m3u", encoding="utf-8-sig") as f:
              for raw in f:
                  line = raw.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF:"):
                      extinf = line
                      extras = []
                      continue

                  if line.startswith("#"):
                      if extinf is not None:
                          extras.append(line)
                      continue

                  if not is_http_url(line):
                      extinf = None
                      extras = []
                      continue

                  if not is_m3u8_url(line):
                      extinf = None
                      extras = []
                      continue

                  if line in seen:
                      extinf = None
                      extras = []
                      continue

                  seen.add(line)

                  entries.append({
                      "extinf": extinf or (
                          '#EXTINF:-1,' + urlparse(line).netloc
                      ),
                      "extras": list(extras),
                      "url": line
                  })

                  extinf = None
                  extras = []

          if len(entries) > MAX_LINKS:
              raise SystemExit(
                  f"Found {len(entries)} links; limit is {MAX_LINKS}"
              )

          print(f"Found {len(entries)} unique M3U8 URLs")

          working = []
          failed = 0

          for index, entry in enumerate(entries, 1):
              url = entry["url"]
              label = entry["extinf"].split(",", 1)[-1]
              print(f"[{index}/{len(entries)}] Checking {label}")

              command = [
                  "ffprobe",
                  "-v", "error",
                  "-rw_timeout", "15000000",
                  "-analyzeduration", "5000000",
                  "-probesize", "5000000",
                  "-read_intervals", "%+8",
                  "-show_entries", "stream=codec_type,codec_name",
                  "-of", "default=noprint_wrappers=1",
                  url
              ]

              try:
                  result = subprocess.run(
                      command,
                      capture_output=True,
                      text=True,
                      timeout=TIMEOUT_SECONDS
                  )

                  output = result.stdout.strip()

                  # A stream must expose at least one media stream.
                  if result.returncode == 0 and "codec_type=" in output:
                      working.append(entry)
                      print("  OK")
                  else:
                      failed += 1
                      print("  FAIL")

              except subprocess.TimeoutExpired:
                  failed += 1
                  print("  FAIL: timeout")

              except Exception as exc:
                  failed += 1
                  print(f"  FAIL: {type(exc).__name__}")

          # Always create a valid M3U playlist, even if no links work.
          with open("working.m3u8", "w", encoding="utf-8") as f:
              f.write("#EXTM3U\n")

              for entry in working:
                  f.write(entry["extinf"] + "\n")

                  for extra in entry["extras"]:
                      f.write(extra + "\n")

                  f.write(entry["url"] + "\n")

          print("")
          print("===== SUMMARY =====")
          print("Total:", len(entries))
          print("Working:", len(working))
          print("Failed:", failed)
          print("Output: working.m3u8")
          print("Checked at:", datetime.now(timezone.utc).isoformat())
          PY

          python check_m3u.py

      - name: Upload working M3U8 playlist
        if: always() && hashFiles('working.m3u8') != ''
        uses: actions/upload-artifact@v4
        with:
          name: working-m3u8-playlist
          path: working.m3u8
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and push working playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add working.m3u8

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update working M3U8 playlist"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
