
name: Test M3U Playlist

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: "M3U playlist URL"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: m3u-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg and IPTV Checker
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install -g iptv-checker
          npm install iptv-checker

      - name: Download playlist
        env:
          PLAYLIST_URL: ${{ inputs.playlist_url }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          from urllib.parse import urlparse

          url = os.environ["PLAYLIST_URL"].strip()
          parsed = urlparse(url)

          if parsed.scheme not in ("http", "https") or not parsed.netloc:
              raise SystemExit("Invalid HTTP(S) playlist URL")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "M3U-Checker/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read(10 * 1024 * 1024 + 1)

          if len(data) > 10 * 1024 * 1024:
              raise SystemExit("Playlist exceeds 10 MB")

          content = data.decode("utf-8-sig", errors="replace")

          if "#EXTM3U" not in content[:4096]:
              raise SystemExit("Not an M3U playlist")

          with open("source.m3u", "w", encoding="utf-8") as file:
              file.write(content)
          PY

      - name: Run IPTV Checker
        run: |
          mkdir -p checker-output
          iptv-checker source.m3u \
            --output checker-output \
            --timeout 120000 \
            --parallel 5 \
            --retry 1

      - name: Export working M3U8 links to JSON
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { IPTVChecker } from 'iptv-checker';

          const checker = new IPTVChecker({
            timeout: 120000,
            parallel: 5,
            retry: 1
          });

          const result = await checker.checkPlaylist('source.m3u');
          const items = result.items || [];

          const seen = new Set();
          const links = [];

          for (const item of items) {
            const url = item.url || '';

            if (!/\.m3u8(?:$|[?#])/i.test(url)) continue;
            if (item.status?.ok !== true) continue;
            if (seen.has(url)) continue;

            seen.add(url);

            links.push({
              name: item.name || '',
              tvg_id: item.tvg?.id || '',
              logo: item.tvg?.logo || '',
              group: item.group?.title || '',
              url,
              status: 'working',
              format: item.status?.metadata?.format?.format_name || '',
              streams: (item.status?.metadata?.streams || []).map(s => ({
                type: s.codec_type || '',
                codec: s.codec_name || '',
                width: s.width || null,
                height: s.height || null
              }))
            });
          }

          const output = {
            source: 'source.m3u',
            checked_at: new Date().toISOString(),
            total_entries: items.length,
            working_m3u8_count: links.length,
            links
          };

          fs.writeFileSync(
            'working_links.json',
            JSON.stringify(output, null, 2) + '\n'
          );

          console.log(`Entries checked: ${items.length}`);
          console.log(`Working M3U8: ${links.length}`);
          JS

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: m3u-check-report
          path: |
            working_links.json
            checker-output/

      - name: Commit and push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add working_links.json

          if git diff --cached --quiet; then
            echo "No JSON changes."
          else
            git commit -m "Update working M3U8 links"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
