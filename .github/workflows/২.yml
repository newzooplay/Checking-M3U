
name: M3U Stream Quality Checker

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: "Enter your M3U playlist URL"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: m3u-quality-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Download playlist
        env:
          PLAYLIST_URL: ${{ inputs.playlist_url }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          from urllib.parse import urlparse

          url = os.environ["PLAYLIST_URL"].strip()
          parsed = urlparse(url)

          if parsed.scheme not in ("http", "https") or not parsed.netloc:
              raise SystemExit("Invalid HTTP/HTTPS playlist URL")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0 M3UChecker/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read(10 * 1024 * 1024 + 1)

          if len(data) > 10 * 1024 * 1024:
              raise SystemExit("Playlist exceeds 10 MB limit")

          content = data.decode("utf-8-sig", errors="replace")

          if not any(
              line.strip().startswith("#EXTM3U")
              for line in content.splitlines()[:10]
          ):
              raise SystemExit("Invalid M3U playlist")

          with open("source.m3u", "w", encoding="utf-8") as f:
              f.write(content)

          print("Playlist downloaded successfully")
          PY

      - name: Check M3U8 streams with FFprobe
        run: |
          cat > check_m3u.py <<'PY'
          import json
          import re
          import subprocess
          import sys
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          MAX_LINKS = 1000
          TIMEOUT_SECONDS = 20

          def parse_attributes(line):
              return dict(
                  re.findall(r'([\w-]+)="([^"]*)"', line)
              )

          def valid_url(url):
              p = urlparse(url)
              return p.scheme in ("http", "https") and bool(p.netloc)

          channels = []
          current = {
              "name": "",
              "tvg_id": "",
              "logo": "",
              "group": ""
          }

          with open("source.m3u", encoding="utf-8-sig") as f:
              for raw_line in f:
                  line = raw_line.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF:"):
                      attrs = parse_attributes(line)
                      title = line.split(",", 1)
                      current = {
                          "name": title[1].strip() if len(title) > 1 else "",
                          "tvg_id": attrs.get("tvg-id", ""),
                          "logo": attrs.get("tvg-logo", ""),
                          "group": attrs.get("group-title", "")
                      }
                      continue

                  if line.startswith("#"):
                      continue

                  if not valid_url(line):
                      continue

                  path = urlparse(line).path.lower()

                  if path.endswith(".m3u8"):
                      channels.append({
                          **current,
                          "url": line
                      })

                  current = {
                      "name": "",
                      "tvg_id": "",
                      "logo": "",
                      "group": ""
                  }

          # Remove duplicate stream URLs.
          unique = {}
          for channel in channels:
              unique.setdefault(channel["url"], channel)

          channels = list(unique.values())

          if len(channels) > MAX_LINKS:
              raise SystemExit(
                  f"Found {len(channels)} links; "
                  f"limit is {MAX_LINKS}"
              )

          print(f"Found {len(channels)} unique M3U8 links")

          working = []
          failed = []

          for index, channel in enumerate(channels, 1):
              url = channel["url"]
              label = channel["name"] or urlparse(url).netloc

              print(f"[{index}/{len(channels)}] Checking {label}")

              command = [
                  "ffprobe",
                  "-v", "error",
                  "-rw_timeout", "15000000",
                  "-analyzeduration", "5000000",
                  "-probesize", "5000000",
                  "-read_intervals", "%+8",
                  "-show_entries",
                  "format=format_name,duration:"
                  "stream=codec_type,codec_name,width,height",
                  "-of", "json",
                  url
              ]

              try:
                  result = subprocess.run(
                      command,
                      capture_output=True,
                      text=True,
                      timeout=TIMEOUT_SECONDS
                  )

                  if result.returncode != 0:
                      failed.append({
                          "name": channel["name"],
                          "url": url,
                          "reason": "FFprobe could not read stream"
                      })
                      print("  FAIL")
                      continue

                  metadata = json.loads(result.stdout or "{}")
                  streams = metadata.get("streams", [])
                  fmt = metadata.get("format", {})
                  format_name = fmt.get("format_name", "")

                  if not streams:
                      failed.append({
                          "name": channel["name"],
                          "url": url,
                          "reason": "No media streams detected"
                      })
                      print("  FAIL: no media streams")
                      continue

                  item = {
                      **channel,
                      "status": "working",
                      "checked_at": datetime.now(
                          timezone.utc
                      ).isoformat(),
                      "format": format_name,
                      "streams": [
                          {
                              "type": s.get("codec_type", ""),
                              "codec": s.get("codec_name", ""),
                              "width": s.get("width"),
                              "height": s.get("height")
                          }
                          for s in streams
                      ]
                  }

                  working.append(item)
                  print("  OK: media detected")

              except subprocess.TimeoutExpired:
                  failed.append({
                      "name": channel["name"],
                      "url": url,
                      "reason": "FFprobe timeout"
                  })
                  print("  FAIL: timeout")

              except Exception as exc:
                  failed.append({
                      "name": channel["name"],
                      "url": url,
                      "reason": type(exc).__name__
                  })
                  print(f"  FAIL: {type(exc).__name__}")

          report = {
              "source": "source.m3u",
              "checked_at": datetime.now(timezone.utc).isoformat(),
              "total_found": len(channels),
              "working_count": len(working),
              "failed_count": len(failed),
              "links": working,
              "failed_links": failed
          }

          with open("working_links.json", "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("")
          print("===== SUMMARY =====")
          print("Found:", len(channels))
          print("Working:", len(working))
          print("Failed:", len(failed))
          print("Saved working_links.json")
          PY

          python check_m3u.py

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3u-quality-report
          path: working_links.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add working_links.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update M3U stream quality report"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
